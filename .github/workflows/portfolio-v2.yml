name: portfolio v2 redesign

on:
  push:
    branches:
      - portfolio-site
    paths:
      - .github/workflows/portfolio-v2.yml

permissions:
  contents: write

jobs:
  redesign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: portfolio-site
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply redesign
        run: python3 scripts/portfolio_v2.py

      - name: Install UI and motion dependencies
        run: npm install gsap @phosphor-icons/react @radix-ui/react-slot class-variance-authority clsx tailwind-merge

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit validated redesign
        shell: bash
        run: |
          rm -f .github/workflows/portfolio-v2.yml scripts/portfolio_v2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign portfolio for professional presentation"
          git push origin HEAD:portfolio-site
