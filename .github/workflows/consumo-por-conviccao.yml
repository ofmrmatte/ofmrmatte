name: Consumo por Convicção - testes

on:
  push:
    paths:
      - 'apps/consumo-por-conviccao/**'
      - '.github/workflows/consumo-por-conviccao.yml'
  pull_request:
    paths:
      - 'apps/consumo-por-conviccao/**'
      - '.github/workflows/consumo-por-conviccao.yml'

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/consumo-por-conviccao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Verificar sintaxe
        run: python -m compileall -q app.py tests
      - name: Executar testes
        run: python -m pytest -q
