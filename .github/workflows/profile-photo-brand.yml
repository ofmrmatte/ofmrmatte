name: profile photo brand

on:
  push:
    branches: [portfolio-site]
    paths:
      - '.github/workflows/profile-photo-brand.yml'

permissions:
  contents: write

jobs:
  update-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: portfolio-site
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use profile photo in brand marks
        run: python -c "from pathlib import Path; p=Path('app/globals.css'); s=p.read_text(encoding='utf-8'); a=s.index('.brand-mark {'); b=s.index('}\n\n.desktop-nav', a)+1; n='.brand-mark {\n  display: inline-block;\n  width: 2.25rem;\n  aspect-ratio: 1;\n  flex: 0 0 auto;\n  overflow: hidden;\n  border: 2px solid rgba(0, 117, 113, 0.24);\n  border-radius: 999px;\n  background-image: url(\"https://avatars.githubusercontent.com/u/279118945?v=4\");\n  background-position: center;\n  background-repeat: no-repeat;\n  background-size: cover;\n  box-shadow: 0 4px 14px rgba(15, 41, 55, 0.12);\n  color: transparent;\n  font-size: 0;\n  transform: none;\n}'; p.write_text(s[:a]+n+s[b:], encoding='utf-8')"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit validated profile photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use profile photo in portfolio brand icons"
          git push origin HEAD:portfolio-site
