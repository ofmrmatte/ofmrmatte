{% extends 'base.html' %}{% block title %}Acesso administrativo — Consumo por Convicção{% endblock %}
{% block content %}<div class="wrap login-area"><div class="form-card"><p class="kicker">ÁREA RESTRITA</p><h1>Administração.</h1><p>Apenas usuários autorizados podem moderar os registros.</p>{% if error %}<div class="alert" role="alert">{{error}}</div>{% endif %}<form class="form-col" method="post" action="/admin/login"><input name="csrf" type="hidden" value="{{csrf}}"><label>E-mail<input name="email" type="email" required autocomplete="username"></label><label>Senha<input name="password" type="password" required autocomplete="current-password"></label><button class="btn" type="submit">Entrar ↗</button></form></div></div>{% endblock %}
